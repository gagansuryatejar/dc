# =================================================================
# NEXUS AI — Docker Compose (Production, Linux VPS / Cloud)
# Services: Discord Bot, Backend API, PostgreSQL, Redis
# PostgreSQL and Redis are NOT exposed publicly (internal network only).
# =================================================================

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — Primary database (internal network only)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_ai}
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    networks:
      - nexus-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed on the host — accessible only via the internal network
    # ports:
    #   - "5432:5432"

  # ─────────────────────────────────────────────────────────────
  # Redis — Cache & BullMQ queue (internal network only)
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-nexus_redis_password}
    volumes:
      - nexus_redis_data:/data
    networks:
      - nexus-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nexus_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed on the host — accessible only via the internal network
    # ports:
    #   - "6379:6379"

  # ─────────────────────────────────────────────────────────────
  # NEXUS AI — Discord Bot + Backend API
  # ─────────────────────────────────────────────────────────────
  nexus-ai:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: nexus-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DEPLOYMENT_MODE: server
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_password}@postgres:5432/${POSTGRES_DB:-nexus_ai}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-nexus_redis_password}@redis:6379
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      OWNER_ID: ${OWNER_ID}
      GUILD_ID: ${GUILD_ID}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      API_PORT: 4000
      DASHBOARD_PORT: ${DASHBOARD_PORT:-3000}
      DASHBOARD_SECRET: ${DASHBOARD_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    env_file:
      - .env
    networks:
      - nexus-internal
    # No published ports for the bot (outbound only). API port exposed for dashboard/health.
    ports:
      - "4000:4000"
    volumes:
      - nexus_logs:/app/logs
      - nexus_backups:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start-period: 20s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # (Optional) Reverse proxy — nginx / traefik would go here for HTTPS
  # ─────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────
# Named volumes (persist across container recreation)
# ─────────────────────────────────────────────────────────────
volumes:
  nexus_postgres_data:
  nexus_redis_data:
  nexus_logs:
  nexus_backups:

# ─────────────────────────────────────────────────────────────
# Internal network — PostgreSQL & Redis are reachable ONLY here
# ─────────────────────────────────────────────────────────────
networks:
  nexus-internal:
    driver: bridge
    internal: false
